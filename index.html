<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 转 ArkTS Model</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>JSON 转 ArkTS Model 工具</h1>
        
        <div class="content">
            <div class="input-section">
                <h2>JSON 输入</h2>
                <textarea id="jsonInput" placeholder="请输入 JSON 内容..."></textarea>
            </div>
            
            <div class="button-section">
                <button id="convertBtn" class="convert-btn">转换</button>
            </div>
            
            <div class="output-section">
                <h2>ArkTS Model 输出</h2>
                <div id="arktsOutput" class="output-container">
                    <div class="empty-hint">转换结果将显示在这里...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="converter.js"></script>
    <script src="app.js"></script>
</body>
</html>
