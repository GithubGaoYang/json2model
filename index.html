<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON转Model转换器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>JSON转ARKTS Model转换器</h1>
        <p class="subtitle">将JSON格式数据自动转换为符合ARKTS规范的类模型代码</p>
        
        <div class="content">
            <div class="input-section">
                <div class="section-header">
                    <h2>JSON输入</h2>
                    <button class="clear-btn" id="clearInputBtn">清空</button>
                </div>
                <textarea id="jsonInput" placeholder="请输入 JSON 内容..."></textarea>
            </div>
            
            <div class="button-section">
                <div class="language-selector">
                    <label for="languageSelect">选择语言</label>
                    <select id="languageSelect">
                        <option value="arkts">ArkTS</option>
                        <option value="swift">Swift</option>
                    </select>
                </div>
                <button id="convertBtn" class="convert-btn">转换</button>
            </div>
            
            <div class="output-section">
                <div class="section-header">
                    <h2 id="outputTitle">ArkTS Model输出</h2>
                </div>
                <div id="arktsOutput" class="output-container">
                    <div class="empty-hint">转换结果将显示在这里...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/swift.min.js"></script>
    <script src="converter.js"></script>
    <script src="app.js"></script>
</body>
</html>
