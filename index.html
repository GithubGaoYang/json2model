<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON转Model转换器 - 支持ArkTS/Swift</title>
    <!-- ElementUI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <!-- Highlight.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>JSON转Model转换器</h1>
            <p class="subtitle">将JSON格式数据自动转换为符合多种语言规范的类模型代码</p>
            
            <div class="content">
                <!-- 输入区域 -->
                <el-card class="input-section" shadow="hover">
                    <div slot="header" class="section-header">
                        <span>JSON输入</span>
                        <el-button size="small" @click="loadExample">加载示例</el-button>
                    </div>
                    <el-input
                        type="textarea"
                        :rows="15"
                        placeholder="请输入 JSON 内容..."
                        v-model="jsonInput"
                        class="json-input"
                        @keydown.ctrl.enter.native="convert"
                        @keydown.meta.enter.native="convert">
                    </el-input>
                    <div class="input-footer">
                        <el-button type="success" @click="convert" :loading="converting" class="convert-btn-full">
                            <i class="el-icon-right"></i> 转换
                        </el-button>
                        <el-button @click="clearInput" icon="el-icon-delete">清空</el-button>
                        <el-button @click="showSettings" icon="el-icon-setting">设置</el-button>
                    </div>
                </el-card>
                
                <!-- 中间按钮区域 -->
                <div class="button-section">
                    <!-- 中间区域留空，语言选择移到设置弹窗 -->
                </div>
                
                <!-- 输出区域 -->
                <el-card class="output-section" shadow="hover">
                    <div slot="header" class="section-header">
                        <span>{{ outputTitle }}</span>
                        <el-button size="small" icon="el-icon-document-copy" @click="copyAllCode" v-if="outputClasses.length > 0">复制代码</el-button>
                    </div>
                    <div class="output-container" v-if="outputClasses.length > 0">
                        <div v-for="(item, index) in outputClasses" :key="index" class="code-block">
                            <div class="code-header">
                                <div class="code-title">{{ item.name }}</div>
                                <el-button size="mini" @click="copyCode(item.code)">复制代码</el-button>
                            </div>
                            <div class="code-content">
                                <pre><code :class="codeLanguageClass" v-html="item.highlightedCode"></code></pre>
                            </div>
                        </div>
                    </div>
                    <div v-else class="empty-hint">
                        <div class="empty-text">// 转换结果将显示在这里...</div>
                    </div>
                </el-card>
            </div>
        </div>
        
        <!-- 设置弹窗 -->
        <el-dialog
            title="设置"
            :visible.sync="settingsDialogVisible"
            width="400px">
            <el-form label-width="100px">
                <el-form-item label="目标语言">
                    <el-select v-model="selectedLanguage" placeholder="请选择" @change="onLanguageChange">
                        <el-option label="ArkTS" value="arkts"></el-option>
                        <el-option label="Swift" value="swift"></el-option>
                    </el-select>
                </el-form-item>
            </el-form>
            <span slot="footer" class="dialog-footer">
                <el-button @click="settingsDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="settingsDialogVisible = false">确定</el-button>
            </span>
        </el-dialog>
    </div>
    
    <!-- Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <!-- ElementUI JS -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <!-- Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/swift.min.js"></script>
    <!-- 转换器 -->
    <script src="converter.js"></script>
    <!-- Vue应用 -->
    <script src="app.js"></script>
</body>
</html>
